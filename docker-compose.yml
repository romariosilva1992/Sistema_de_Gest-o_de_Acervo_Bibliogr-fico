services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATA_FILE: /app/data/books.json
    volumes:
      - biblioteca_data:/app/data
    restart: unless-stopped

volumes:
  biblioteca_data:
